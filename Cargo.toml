[package]
name = "ptz-rally"
version = "0.1.0"
edition = "2021"
authors = ["andryjay"]
description = "PTZ Camera Controller for Logitech Rally and UVC cameras on Linux"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.28"
ratatui = "0.29"
tiny_http = "0.12"
anyhow = "1.0"
libc = "0.2"
dirs = "6.0"
