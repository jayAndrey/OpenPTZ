[package]
name = "openptz"
version = "0.1.0"
edition = "2021"
authors = ["andryjay"]
description = "Modern, cross-platform PTZ camera controller for Linux, Windows & macOS with live video preview, Web GUI, TUI, and REST API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jayAndrey/OpenPTZ"
homepage = "https://github.com/jayAndrey/OpenPTZ"
keywords = ["ptz", "camera", "logitech-rally", "v4l2", "streaming"]
categories = ["command-line-utilities", "multimedia::video"]
readme = "README.md"

[lib]
name = "openptz"
path = "src/lib.rs"

[[bin]]
name = "openptz"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.28"
ratatui = "0.29"
tiny_http = "0.12"
anyhow = "1.0"
dirs = "6.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_Media_KernelStreaming",
    "Win32_System_Ole",
] }

[package.metadata.deb]
name = "openptz"
maintainer = "Andry Jay <soika.andrey@gmail.com>"
copyright = "2026, Andry Jay <soika.andrey@gmail.com>"
license-file = ["LICENSE-MIT", "4"]
extended-description = """\
OpenPTZ is a modern, high-performance cross-platform PTZ (Pan-Tilt-Zoom) \
camera controller with live video preview, Web GUI, TUI, CLI, and REST API."""
depends = "$auto"
section = "video"
priority = "optional"
assets = [
    ["target/release/openptz", "usr/bin/", "755"],
    ["assets/openptz.desktop", "usr/share/applications/", "644"],
    ["assets/openptz.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/openptz/README.md", "644"],
]

[package.metadata.wix]
upgrade-guid = "1B65787F-B637-4AEB-B220-3463684B69A9"
path-guid = "F1EB2729-5F63-4DBD-8ACD-FBFCD0F89A1D"
license = "assets/license.rtf"
eula = false
