name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Release (AppImage, Deb & Tarball)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install build tools and cargo-deb
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file wget pkg-config libclang-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev
          cargo install cargo-deb --locked

      - name: Build release binary
        run: cargo build --release

      # 1. Package standalone tarball
      - name: Create Tarball bundle
        run: |
          mkdir -p package/openptz
          cp target/release/openptz package/openptz/
          cp README.md LICENSE-MIT LICENSE-APACHE package/openptz/
          cp -r assets package/openptz/
          cd package
          tar -czvf ../openptz-linux-x86_64.tar.gz openptz
          cd ..

      # 2. Package .deb
      - name: Build Debian package (.deb)
        run: |
          cargo deb --no-build -o openptz-linux-amd64.deb

      # 3. Package AppImage
      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          sed -i 's|AI\x02|\x00\x00\x00|' appimagetool || true

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          mkdir -p AppDir/usr/share/applications

          cp target/release/openptz AppDir/usr/bin/
          cp assets/openptz.desktop AppDir/
          cp assets/openptz.desktop AppDir/usr/share/applications/
          cp assets/openptz.svg AppDir/
          cp assets/openptz.svg AppDir/openptz.svg
          cp assets/openptz.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          if [ $# -eq 0 ]; then
              exec "${HERE}/usr/bin/openptz" gui
          else
              exec "${HERE}/usr/bin/openptz" "$@"
          fi
          EOF
          chmod +x AppDir/AppRun

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir OpenPTZ-x86_64.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            OpenPTZ-x86_64.AppImage
            openptz-linux-amd64.deb
            openptz-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows Release (MSI Installer, Setup EXE & Zip)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build release binary
        run: cargo build --release

      # 1. Package Windows Portable ZIP
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package/openptz
          Copy-Item target/release/openptz.exe package/openptz/
          Copy-Item assets/openptz.ico package/openptz/
          Copy-Item README.md package/openptz/
          Copy-Item LICENSE-MIT package/openptz/
          Copy-Item LICENSE-APACHE package/openptz/
          Compress-Archive -Path package/openptz -DestinationPath openptz-windows-x86_64.zip

      # 2. Package Windows MSI Installer (WiX Toolset)
      - name: Build Windows MSI Installer
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}" -match '^v?([0-9]+\.[0-9]+\.[0-9]+)') { $matches[1] } else { "0.2.0" }
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (Test-Path "$wixBin\candle.exe") {
            $env:PATH = "$wixBin;$env:PATH"
          }
          New-Item -ItemType Directory -Force -Path target/wix | Out-Null
          candle -arch x64 -dVersion="$ver" -ext WixUIExtension wix/main.wxs -out target/wix/main.wixobj
          light -ext WixUIExtension target/wix/main.wixobj -out openptz-windows-x86_64.msi

      # 3. Package Inno Setup EXE Installer
      - name: Build Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/windows/openptz.iss
          Move-Item target/installer/openptz-windows-x86_64-setup.exe ./openptz-windows-x86_64-setup.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            openptz-windows-x86_64.zip
            openptz-windows-x86_64.msi
            openptz-windows-x86_64-setup.exe

  build-macos:
    name: Build macOS Release (Universal / Apple Silicon & Intel)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Package macOS Tarballs
        run: |
          # Intel (x86_64)
          mkdir -p package-intel/openptz
          cp target/x86_64-apple-darwin/release/openptz package-intel/openptz/
          cp README.md LICENSE-MIT LICENSE-APACHE package-intel/openptz/
          tar -czvf openptz-macos-x86_64.tar.gz -C package-intel openptz

          # Apple Silicon (aarch64)
          mkdir -p package-arm/openptz
          cp target/aarch64-apple-darwin/release/openptz package-arm/openptz/
          cp README.md LICENSE-MIT LICENSE-APACHE package-arm/openptz/
          tar -czvf openptz-macos-aarch64.tar.gz -C package-arm openptz

      # 3. Package Universal DMG Installer
      - name: Package Universal macOS DMG
        run: |
          mkdir -p dmg-staging
          mkdir -p dmg-staging/OpenPTZ.app/Contents/MacOS
          mkdir -p dmg-staging/OpenPTZ.app/Contents/Resources
          lipo -create -output dmg-staging/OpenPTZ.app/Contents/MacOS/openptz \
            target/x86_64-apple-darwin/release/openptz \
            target/aarch64-apple-darwin/release/openptz
          mv dmg-staging/OpenPTZ.app/Contents/MacOS/openptz \
            dmg-staging/OpenPTZ.app/Contents/MacOS/openptz-bin
          cat << 'EOF' > dmg-staging/OpenPTZ.app/Contents/MacOS/openptz
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "${HERE}/openptz-bin" gui "$@"
          EOF
          chmod +x dmg-staging/OpenPTZ.app/Contents/MacOS/openptz
          APP_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${APP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            APP_VERSION="0.2.0"
          fi
          cat << EOF > dmg-staging/OpenPTZ.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>openptz</string>
            <key>CFBundleIdentifier</key>
            <string>com.openptz.app</string>
            <key>CFBundleName</key>
            <string>OpenPTZ</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${APP_VERSION}</string>
            <key>NSCameraUsageDescription</key>
            <string>OpenPTZ uses the camera to display a live video preview.</string>
          </dict>
          </plist>
          EOF
          cp assets/openptz.svg dmg-staging/OpenPTZ.app/Contents/Resources/
          cp README.md LICENSE-MIT LICENSE-APACHE dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "OpenPTZ" -srcfolder dmg-staging -ov -format UDZO openptz-macos-universal.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            openptz-macos-x86_64.tar.gz
            openptz-macos-aarch64.tar.gz
            openptz-macos-universal.dmg

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenPTZ ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
